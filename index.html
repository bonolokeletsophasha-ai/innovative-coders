<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Innovative Coders</title>

    <!--CSS Link-->
    <link rel="stylesheet" href="style.css">

    <!-- Google Font -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!--Font Awesome Icons-->
    <script src="https://kit.fontawesome.com/a8205bbe84.js" crossorigin="anonymous"></script>
</head>
<body>
   
    <!--Contact Section-->
    <section id="contact" class="contact-section">
        <h2>Contact Us</h2>

        <div class="contact-container">
            <div class="contact info">
                <h3>Let's Connect</h3>
                <p>Interested in learning more about Innovative Coders?</p>
                <p>We'd love to hear from you.</p>
                <div class="contact-item">
                    <i class="fa-regular fa-envelope"></i>
                    <div class="contact-details">
                        <strong>Email:</strong>
                        <p>info@innovativecoders.com</p>
                    </div>
                </div>
            </div>
            <div class="contact-item">
                <i class="fa-brands fa-github"></i>
                <div class="contact-details">
                    <strong>GitHub:</strong>
                    <p>github.com/innovativecoders</p>
                </div>
            </div>
            <div class="contact-form">
            <form>
                <div class="form-row">
                    <input type="text" placeholder="Your Name">
                    <input type="email" placeholder="Your Email">
                </div>
                <textarea placeholder="Your Message"></textarea>
                <button type="submit">Send Message</button>
            </form>
            </div>            
        </div>
    </section>
</body>
</html>
